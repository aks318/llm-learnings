<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1 class="app-title">AI Chatbot</h1>
            <button class="new-chat-btn" id="new-chat-btn">
                <span>New Chat</span>
            </button>
            <button class="clear-chat-btn" id="clear-chat-btn">
                <span>Clear Chat</span>
            </button>
        </div>

        <div class="chat-container" id="chat-container">
            <div class="welcome-screen" id="welcome-screen">
                <h1>Welcome to AI Chatbot</h1>
                <p>Ask me anything and I'll do my best to help you. Try one of the suggestions below to get started!</p>
                <div class="suggested-prompts">
                    <button class="prompt-btn" data-prompt="What can you do?">What can you do?</button>
                    <button class="prompt-btn" data-prompt="Explain quantum computing in simple terms">Explain quantum computing in simple terms</button>
                    <button class="prompt-btn" data-prompt="How do I make an HTTP request in JavaScript?">How do I make an HTTP request in JavaScript?</button>
                    <button class="prompt-btn" data-prompt="Write a poem about artificial intelligence">Write a poem about artificial intelligence</button>
                </div>
            </div>

            <div class="messages" id="messages">
                <!-- Messages will appear here -->
            </div>

            <div class="typing-indicator" id="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="input-container">
                <textarea 
                    id="message-input" 
                    placeholder="Type your message here..." 
                    rows="1"
                ></textarea>
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
